<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WandyT Company | Premium Armory & Arcana</title>
  <style>
    :root {
      /* Colors */
      --bg-base: #050507;
      --bg-panel: rgba(18, 19, 25, 0.55);
      --bg-panel-solid: #121319;
      --border-glass: rgba(255, 255, 255, 0.06);
      --border-highlight: rgba(255, 255, 255, 0.12);
      
      --accent-emerald: #00e676;
      --accent-emerald-glow: rgba(0, 230, 118, 0.25);
      --accent-diamond: #00e5ff;
      --accent-netherite: #d500f9;
      
      --text-main: #ffffff;
      --text-muted: #8b949e;
      
      /* Typography */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Layout & Shadows */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --shadow-neon: 0 4px 15px var(--accent-emerald-glow);
      
      /* Z-Index */
      --z-behind: -1;
      --z-base: 1;
      --z-header: 100;
      --z-cart: 200;
      --z-modal: 300;
      --z-toast: 400;
      --z-cursor: 9999;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    /* Only hide the default cursor if the custom image loads successfully */
    body.custom-cursor-active,
    body.custom-cursor-active * {
      cursor: none !important;
    }

    /* Custom HTML Cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 35px;
      height: 35px;
      pointer-events: none;
      z-index: var(--z-cursor);
      transform-origin: top left;
      will-change: transform;
      /* Only transition dimensions for the hover effect, not position to prevent lag */
      transition: width 0.2s ease, height 0.2s ease, filter 0.2s ease;
      color: transparent; /* Hide broken alt text if path fails */
      display: none; /* Hidden until loaded */
    }
    
    #custom-cursor.active {
      width: 45px;
      height: 45px;
      filter: drop-shadow(0 0 10px var(--accent-diamond));
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% 0%, #151a25 0%, var(--bg-base) 60%);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: #2c303c; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-emerald); }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .glass {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-glass);
    }

    .gradient-text {
      background: linear-gradient(135deg, #fff 0%, var(--accent-emerald) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      z-index: var(--z-header);
      padding: 1rem 0;
      transition: all 0.3s ease;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      letter-spacing: -0.5px;
    }

    .llama-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      /* Removed pixelated rendering for jpgs to prevent visual distortion */
      border: 2px solid var(--border-highlight);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .logo span {
      background: linear-gradient(to right, #fff, var(--accent-emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cart-btn {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-lg);
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-btn:hover {
      background: var(--accent-emerald);
      color: var(--bg-base);
      box-shadow: var(--shadow-neon);
      transform: translateY(-1px);
    }

    .cart-badge {
      background: var(--text-main);
      color: var(--bg-base);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .hero {
      position: relative;
      max-width: 1400px;
      margin: 4rem auto;
      padding: 6rem 2rem;
      text-align: center;
      overflow: hidden;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      background: radial-gradient(circle at 50% 50%, rgba(0,230,118,0.05) 0%, transparent 60%);
    }

    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-behind);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: var(--z-base);
    }

    .hero-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-glass);
      border-radius: 50px;
      font-size: 0.85rem;
      color: var(--accent-diamond);
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(3rem, 5vw, 5rem);
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 2.5rem;
    }

    .section-container {
      max-width: 1400px;
      margin: 5rem auto;
      padding: 0 2rem;
    }

    .section-header {
      margin-bottom: 3rem;
      text-align: center;
    }

    .section-header h2 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 250px;
      gap: 1.5rem;
      margin-bottom: 4rem;
    }

    .bento-card {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      transition: transform 0.3s ease, border-color 0.3s;
      border: 1px solid var(--border-glass);
      background: var(--bg-panel-solid);
    }

    .bento-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
      z-index: 1;
    }

    .bento-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-emerald);
    }

    .bento-large { grid-column: span 2; }
    .bento-content { position: relative; z-index: 2; }
    .bento-content h3 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .bento-content p { color: var(--text-muted); font-size: 0.9rem; }

    @media (max-width: 900px) {
      .bento-grid { grid-template-columns: repeat(2, 1fr); }
      .bento-large { grid-column: span 2; }
    }
    @media (max-width: 600px) {
      .bento-grid { grid-template-columns: 1fr; }
      .bento-large { grid-column: span 1; }
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .filter-chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-glass);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    .filter-chip:hover, .filter-chip.active {
      background: var(--text-main);
      color: var(--bg-base);
      border-color: var(--text-main);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    /* 3D Tilt Card Base */
    .tilt-card {
      position: relative;
      border-radius: var(--radius-md);
      background: var(--bg-panel);
      border: 1px solid var(--border-glass);
      padding: 1.5rem;
      transform-style: preserve-3d;
      will-change: transform;
      transition: border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .tilt-card:hover { border-color: var(--border-highlight); }
    
    .card-inner { transform: translateZ(30px); }

    /* Skeleton & Image */
    .image-container {
      width: 100%;
      height: 200px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
      margin-bottom: 1.5rem;
      background: #1a1d24;
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer; /* To trigger quick view */
    }

    .skeleton {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, #1a1d24 25%, #2a2d35 50%, #1a1d24 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      z-index: 2;
      transition: opacity 0.5s ease;
    }

    .image-container.loaded .skeleton { opacity: 0; pointer-events: none; }
    
    .item-image {
      width: 60%;
      height: 60%;
      object-fit: contain;
      image-rendering: pixelated;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.3s ease;
    }

    .image-container.loaded .item-image { opacity: 1; }
    .image-container:hover .item-image { transform: scale(1.1); }

    /* Badges & Text */
    .card-badges { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-diamond { background: rgba(0, 229, 255, 0.1); color: var(--accent-diamond); border: 1px solid rgba(0, 229, 255, 0.2); }
    .badge-netherite { background: rgba(213, 0, 249, 0.1); color: var(--accent-netherite); border: 1px solid rgba(213, 0, 249, 0.2); }
    .badge-arcana { background: rgba(255, 171, 0, 0.1); color: #ffab00; border: 1px solid rgba(255, 171, 0, 0.2); }

    .item-title { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .item-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; flex-grow: 1; }
    
    /* Footer of Card */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border-glass);
    }

    .price { font-size: 1.2rem; font-weight: 700; color: var(--accent-emerald); }
    .price span { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; }

    .add-btn {
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    .add-btn:hover {
      background: var(--accent-emerald);
      border-color: var(--accent-emerald);
      color: var(--bg-base);
      transform: rotate(90deg);
    }

    /* Upgrade Toggle */
    .upgrade-wrap {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted);
    }
    .toggle-switch {
      position: relative; width: 36px; height: 20px;
      background: #2c303c; border-radius: 20px; cursor: pointer;
      transition: 0.3s;
    }
    .toggle-switch::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; background: #fff; border-radius: 50%;
      transition: 0.3s;
    }
    input[type="checkbox"]:checked + .toggle-switch { background: var(--accent-netherite); }
    input[type="checkbox"]:checked + .toggle-switch::after { transform: translateX(16px); }
    .upgrade-wrap input { display: none; }

    .cart-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      z-index: calc(var(--z-cart) - 1);
      opacity: 0; pointer-events: none; transition: 0.3s ease;
    }
    .cart-overlay.active { opacity: 1; pointer-events: all; }

    .side-cart {
      position: fixed; top: 0; right: -400px;
      width: 100%; max-width: 400px; height: 100vh;
      background: var(--bg-panel-solid);
      border-left: 1px solid var(--border-glass);
      z-index: var(--z-cart);
      display: flex; flex-direction: column;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-glass);
    }
    .side-cart.active { right: 0; }

    .cart-header {
      padding: 1.5rem; border-bottom: 1px solid var(--border-glass);
      display: flex; justify-content: space-between; align-items: center;
    }
    .close-cart { background: none; border: none; color: var(--text-main); font-size: 1.5rem; }

    .cart-items { flex-grow: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    
    .cart-item {
      display: flex; gap: 1rem; align-items: center;
      background: rgba(255,255,255,0.02); padding: 1rem;
      border-radius: var(--radius-sm); border: 1px solid var(--border-glass);
    }
    .cart-item-img {
      width: 50px; height: 50px; background: #1a1d24; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-item-info { flex-grow: 1; }
    .cart-item-title { font-size: 0.9rem; font-weight: 600; }
    .cart-item-price { font-size: 0.85rem; color: var(--accent-emerald); }
    .remove-item { color: #ff4d4d; background: none; border: none; cursor: pointer; font-size: 0.8rem; }

    .cart-footer {
      padding: 1.5rem; border-top: 1px solid var(--border-glass); background: rgba(0,0,0,0.2);
    }
    .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; }
    .checkout-btn {
      width: 100%; padding: 1rem; background: var(--accent-emerald);
      color: var(--bg-base); border: none; border-radius: var(--radius-sm);
      font-weight: 700; font-size: 1rem; transition: 0.3s;
    }
    .checkout-btn:hover { background: #00c853; box-shadow: var(--shadow-neon); }

    .toast-container {
      position: fixed; bottom: 2rem; right: 2rem; z-index: var(--z-toast);
      display: flex; flex-direction: column; gap: 1rem; pointer-events: none;
    }
    .toast {
      background: var(--bg-panel); border: 1px solid var(--border-glass);
      backdrop-filter: blur(12px); padding: 1rem 1.5rem; border-radius: var(--radius-sm);
      display: flex; align-items: center; gap: 1rem; color: var(--text-main);
      box-shadow: var(--shadow-glass); animation: slideInRight 0.3s forwards; pointer-events: all;
    }
    .toast::before { content: '✓'; color: var(--accent-emerald); font-weight: bold; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      z-index: var(--z-modal); display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.3s;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    
    .quick-view-modal {
      background: var(--bg-panel-solid); border: 1px solid var(--border-glass);
      border-radius: var(--radius-md); width: 90%; max-width: 800px;
      display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;
      transform: scale(0.95); transition: transform 0.3s; box-shadow: var(--shadow-glass);
    }
    .modal-overlay.active .quick-view-modal { transform: scale(1); }
    
    .modal-image { background: radial-gradient(circle, #2a2d35 0%, #121319 100%); display: flex; align-items: center; justify-content: center; padding: 3rem; }
    .modal-image img { width: 100%; max-width: 250px; image-rendering: pixelated; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); animation: float 4s ease-in-out infinite; }
    .modal-info { padding: 3rem; position: relative; }
    .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; transition: 0.2s; }
    .modal-close:hover { color: #fff; transform: rotate(90deg); }

    @media (max-width: 768px) {
      .quick-view-modal { grid-template-columns: 1fr; }
      .modal-image { padding: 2rem; }
      .modal-info { padding: 2rem; }
    }

    /* AI Chat System */
    .ai-chat-btn {
      position: fixed; bottom: 2rem; left: 2rem; z-index: var(--z-modal);
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--bg-panel); border: 2px solid var(--accent-diamond);
      box-shadow: var(--shadow-neon); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.8rem; transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }
    .ai-chat-btn:hover { transform: scale(1.1); border-color: var(--accent-emerald); }
    
    .ai-chat-window {
      position: fixed; bottom: 6rem; left: 2rem; z-index: var(--z-modal);
      width: 350px; height: 450px; background: var(--bg-panel-solid);
      border: 1px solid var(--border-glass); border-radius: var(--radius-md);
      box-shadow: var(--shadow-glass); display: flex; flex-direction: column;
      transform: translateY(20px) scale(0.95); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: bottom left;
    }
    .ai-chat-window.active { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }
    
    .chat-header {
      padding: 1rem; border-bottom: 1px solid var(--border-glass);
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 230, 118, 0.05); border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .chat-messages {
      flex-grow: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .msg { max-width: 85%; padding: 0.8rem 1rem; border-radius: var(--radius-sm); font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #2c303c; color: #fff; border-bottom-right-radius: 2px; }
    .msg.ai { align-self: flex-start; background: rgba(0, 230, 118, 0.1); border: 1px solid var(--border-glass); color: #fff; border-bottom-left-radius: 2px; }
    
    .chat-input {
      padding: 1rem; border-top: 1px solid var(--border-glass); display: flex; gap: 0.5rem;
      background: var(--bg-panel); border-radius: 0 0 var(--radius-md) var(--radius-md);
    }
    .chat-input input {
      flex-grow: 1; padding: 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border-glass);
      background: #1a1d24; color: #fff; outline: none; transition: border-color 0.2s;
    }
    .chat-input input:focus { border-color: var(--accent-emerald); }
    .chat-input button {
      padding: 0.8rem 1.2rem; background: var(--accent-emerald); border: none;
      border-radius: var(--radius-sm); color: var(--bg-base); font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .chat-input button:hover { background: #00c853; }
    
    .lore-btn {
      background: linear-gradient(135deg, #d500f9 0%, #00e5ff 100%);
      border: none; color: white; padding: 0.6rem 1.2rem; border-radius: var(--radius-sm);
      font-weight: 600; cursor: pointer; font-size: 0.85rem; margin-bottom: 1.5rem;
      display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.3s ease;
    }
    .lore-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(213, 0, 249, 0.4); }
    .lore-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
  <title>WandyT Company | Premium Armory & Arcana</title>
</head>
<body>

  <!-- Custom Cursor Element with Fallback -->
  <img src="./pngfind.com-minecraft-pickaxe-png-2443801.png" id="custom-cursor" alt="" onerror="this.onerror=null; this.style.display='none'; document.body.classList.remove('custom-cursor-active');">

  <header class="glass" id="header">
    <div class="nav-container">
      <div class="logo">
        <img src="./big-llama-face.jpg" alt="WandyT Logo" class="llama-logo" onerror="this.onerror=null; this.src='https://placehold.co/40x40/181a20/00e676?text=WT';">
        <span>WandyT Armory</span>
      </div>
      <button class="cart-btn" onclick="toggleCart()">

  <script>
    // System State
    let cart = [];
    
    function initCustomCursor() {
      const cursor = document.getElementById('custom-cursor');
      if (!cursor) return;
      
      const enableCursor = () => {
        document.body.classList.add('custom-cursor-active');
        cursor.style.display = 'block';
      };
      
      // Only enable custom cursor if image loads successfully to prevent blind UX
      if (cursor.complete && cursor.naturalHeight !== 0) {
        enableCursor();
      } else {
        cursor.onload = enableCursor;
      }
      
      // Track mouse movement
      document.addEventListener('mousemove', (e) => {
        // Offset slightly (-4px) to align the pickaxe tip with the true click point
        cursor.style.transform = `translate(${e.clientX - 4}px, ${e.clientY - 4}px)`;
      });

      // Add glow and scale effects when hovering over interactive elements
      const clickables = document.querySelectorAll('button, a, input, .image-container, .filter-chip, .ai-chat-btn, .toggle-switch');
      clickables.forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('active'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('active'));
      });
    }

    // Initialize functions on load
    document.addEventListener("DOMContentLoaded", () => {
      initCustomCursor();
      initSkeletons();
      initObservers();
      initTilt();
      initFilters();
      createParticles();
      
      // Load cart from LocalStorage
      const savedCart = localStorage.getItem('wandyt_cart');
      if (savedCart) {
        cart = JSON.parse(savedCart);
        updateCartUI();
      }
    });

    // Skeleton loaders timeout (simulating image load)
    function initSkeletons() {
      setTimeout(() => {
        document.querySelectorAll('.image-container').forEach(el => {
          el.classList.add('loaded');
        });
      }, 2000);
    }

    // Scroll Reveal Observer
    function initObservers() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    function initTilt() {
      const cards = document.querySelectorAll('.tilt-card');
      
      cards.forEach(card => {
        card.addEventListener('mousemove', e => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -4; // Toned down from 10 deg
          const rotateY = ((x - centerX) / centerX) * 4;  // Toned down from 10 deg
          
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
        });
        
        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
          card.style.transition = 'transform 0.5s ease';
        });
        
        card.addEventListener('mouseenter', () => {
          card.style.transition = 'none'; // remove transition for smooth tracking
        });
      });
    }

    function createParticles() {
      const container = document.getElementById('particles-js');
      const particleCount = 15; // Halved for subtlety
      
      for(let i=0; i<particleCount; i++) {
        const particle = document.createElement('div');
        particle.style.position = 'absolute';
        particle.style.width = Math.random() * 4 + 'px';
        particle.style.height = particle.style.width;
        particle.style.background = Math.random() > 0.5 ? 'var(--accent-emerald)' : 'var(--accent-diamond)';
        particle.style.borderRadius = '50%';
        particle.style.opacity = Math.random() * 0.3; // Toned down opacity
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animation = `float ${Math.random() * 6 + 5}s ease-in-out infinite`; // Slower movement
        particle.style.animationDelay = `${Math.random() * 2}s`;
        container.appendChild(particle);
      }
    }

    function initFilters() {
      const chips = document.querySelectorAll('.filter-chip');
      const items = document.querySelectorAll('.tilt-card');

      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          // Update active chip
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          
          const filter = chip.getAttribute('data-filter');
          
          items.forEach(item => {
            const categories = item.getAttribute('data-category');
            if (filter === 'all' || categories.includes(filter)) {
              item.style.display = 'flex';
              setTimeout(() => item.classList.add('active'), 50); // re-trigger animation
            } else {
              item.style.display = 'none';
              item.classList.remove('active');
            }
          });
        });
      });
    }

    // Handle Tier Upgrade
    function toggleTier(checkbox, id, basePrice, upgradeCost) {
      const card = checkbox.closest('.tilt-card');
      const priceDisplay = card.querySelector('.price-val');
      const badge = card.querySelector('.tier-badge');
      const addBtn = card.querySelector('.add-btn');
      
      let currentPrice = basePrice;
      let isNetherite = checkbox.checked;

      if (isNetherite) {
        currentPrice = basePrice + upgradeCost;
        badge.textContent = 'Netherite';
        badge.className = 'badge badge-netherite tier-badge';
        card.style.borderColor = 'var(--accent-netherite)';
      } else {
        badge.textContent = 'Diamond';
        badge.className = 'badge badge-diamond tier-badge';
        card.style.borderColor = 'var(--border-glass)';
      }
      
      priceDisplay.textContent = currentPrice;
      
      // Update onclick function
      const title = card.querySelector('.item-title').textContent;
      const finalName = isNetherite ? `Netherite ${title.split(' ')[0]}` : title;
      
      addBtn.setAttribute('onclick', `addToCart('${id}', '${finalName}', ${currentPrice}, this)`);
    }

    function addToCart(id, name, price, btnElement) {
      // Check if exists
      const existing = cart.find(item => item.id === id && item.name === name);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, name, price, qty: 1 });
      }
      
      saveCart();
      updateCartUI();
      showToast(`${name} added to Ender Chest`);
      
      // Button effect
      if(btnElement) {
        const ogHTML = btnElement.innerHTML;
        btnElement.innerHTML = '✓';
        btnElement.style.background = 'var(--accent-emerald)';
        btnElement.style.color = 'var(--bg-base)';
        setTimeout(() => {
          btnElement.innerHTML = ogHTML;
          btnElement.style.background = '';
          btnElement.style.color = '';
        }, 1000);
      }
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      saveCart();
      updateCartUI();
    }

    function saveCart() {
      localStorage.setItem('wandyt_cart', JSON.stringify(cart));
    }

    function updateCartUI() {
      const container = document.getElementById('cart-items-container');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total-val');
      
      container.innerHTML = '';
      let total = 0;
      let count = 0;
      
      cart.forEach((item, index) => {
        total += item.price * item.qty;
        count += item.qty;
        
        container.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-img">📦</div>
            <div class="cart-item-info">
              <div class="cart-item-title">${item.name} <span style="color:var(--text-muted)">x${item.qty}</span></div>
              <div class="cart-item-price">${item.price * item.qty} EME</div>
            </div>
            <button class="remove-item" onclick="removeFromCart(${index})">🗑️</button>
          </div>
        `;
      });
      
      if (cart.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your Ender Chest is empty.</p>';
      }
      
      countEl.textContent = count;
      totalEl.textContent = total;
    }

    function toggleCart() {
      document.getElementById('side-cart').classList.toggle('active');
      document.getElementById('cart-overlay').classList.toggle('active');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(20px)';
        toast.style.transition = 'all 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function openQuickView(id) {
      // Find card data
      const card = document.querySelector(`.tilt-card[data-id="${id}"]`);
      if(!card) return;
      
      const title = card.querySelector('.item-title').textContent;
      const desc = card.querySelector('.item-desc').textContent;
      const price = card.querySelector('.price-val').textContent;
      const imgHtml = card.querySelector('.item-image').outerHTML;
      const badges = card.querySelector('.card-badges').innerHTML;
      
      document.getElementById('qv-title').textContent = title;
      document.getElementById('qv-desc').textContent = desc;
      document.getElementById('qv-price').textContent = price;
      
      const loreBtn = document.getElementById('generate-lore-btn');
      if (loreBtn) {
        loreBtn.style.display = 'inline-flex';
        loreBtn.disabled = false;
        loreBtn.innerHTML = '✨ Translate Ancient Lore (AI)';
      }
      
      const imgContainer = document.querySelector('.modal-image');
      imgContainer.innerHTML = imgHtml;
      // ensure image is visible in modal
      imgContainer.querySelector('.item-image').style.opacity = '1'; 
      imgContainer.querySelector('.item-image').style.width = '150px'; 
      imgContainer.querySelector('.item-image').style.height = '150px'; 
      
      document.getElementById('qv-badges').innerHTML = badges;
      
      document.getElementById('quick-view-overlay').classList.add('active');
    }

    function closeQuickView(event, force = false) {
      if (force || event.target.id === 'quick-view-overlay') {
        document.getElementById('quick-view-overlay').classList.remove('active');
      }
    }

    // --- Gemini API Features ---
    const GEMINI_API_KEY = ""; // Intentionally blank, injected securely by runtime
    const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;
    
    let chatHistory = [];
    const clericsSystemPrompt = "You are an ancient, wise Minecraft Village Cleric working at WandyT Armory. You sell enchanted diamond/netherite gear and forbidden arcana. Help customers pick gear for their adventures (e.g. fighting the Wither, Warden, or exploring). Keep responses short (1 to 2 sentences max), highly thematic, and use Minecraft terminology (mobs, durability, emeralds). Never break character.";

    // Exponential backoff helper for API calls
    async function fetchWithBackoff(url, options, retries = 3, delay = 1000) {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok && response.status === 429) throw new Error('Rate limited');
          return response;
        } catch (error) {
          if (i === retries - 1) throw error;
          await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
        }
      }
    }

    function toggleAIChat() {
      document.getElementById('ai-chat-window').classList.toggle('active');
    }

    async function sendChatMessage() {
      const inputEl = document.getElementById('chat-input-field');
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputEl.value = '';
      
      const typingId = appendMessage('Consulting the ancients...', 'ai');

      // Construct conversational payload
      const contents = chatHistory.map(msg => ({
        role: msg.role === 'ai' ? 'model' : 'user',
        parts: [{ text: msg.text }]
      }));
      contents.push({ role: 'user', parts: [{ text: text }] });

      const payload = {
        contents: contents,
        systemInstruction: { parts: [{ text: clericsSystemPrompt }] }
      };

      try {
        const response = await fetchWithBackoff(GEMINI_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.candidates && result.candidates[0].content) {
          const aiText = result.candidates[0].content.parts[0].text;
          updateMessage(typingId, aiText);
          chatHistory.push({ role: 'user', text: text });
          chatHistory.push({ role: 'ai', text: aiText });
        } else {
          updateMessage(typingId, "The arcane connection was lost in the nether. Try again.");
        }
      } catch (e) {
        updateMessage(typingId, "The sculk sensors are jamming my signal. (API Error)");
      }
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.id = 'msg-' + Date.now();
      msgDiv.textContent = text;
      
      const container = document.getElementById('chat-messages');
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      return msgDiv.id;
    }

    function updateMessage(id, text) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = text;
        const container = document.getElementById('chat-messages');
        container.scrollTop = container.scrollHeight; // Auto-scroll on update
      }
    }

    async function generateLore() {
      const title = document.getElementById('qv-title').textContent;
      const descEl = document.getElementById('qv-desc');
      const btn = document.getElementById('generate-lore-btn');
      
      const prompt = `Write a short, epic, and mysterious 2-sentence Minecraft lore for an item named "${title}". Make it sound like an ancient relic found in an Ancient City, Bastion Remnant, or Stronghold.`;
      
      btn.disabled = true;
      btn.innerHTML = '✨ Unearthing Secrets...';

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "You are a master Minecraft loremaster writing high-fantasy item descriptions." }] }
      };

      try {
        const response = await fetchWithBackoff(GEMINI_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.candidates && result.candidates[0].content) {
          const loreText = result.candidates[0].content.parts[0].text;
          // Prepend the AI lore to the existing mechanical description
          const currentDesc = descEl.getAttribute('data-original') || descEl.textContent;
          descEl.setAttribute('data-original', currentDesc);
          
          descEl.innerHTML = `<span style="color: var(--accent-netherite); font-style: italic;">"${loreText}"</span><br><br><span style="font-size: 0.9em; opacity: 0.8;">Stats: ${currentDesc}</span>`;
          btn.style.display = 'none';
        } else {
          throw new Error("No candidates");
        }
      } catch (e) {
        btn.innerHTML = '✨ Magic Failed. Try again.';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
